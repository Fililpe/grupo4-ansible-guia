---
# 04-template-config.yml
# Responsável: Miqueias Eduardo
# Descrição: Exemplo de utilização de variáveis, facts e templates Jinja2
#
# Execução:
# ansible-playbook -i ../inventario/hosts.ini exemplos/04-template-config.yml

- name: Exemplo de Variáveis, Facts e Templates Jinja2
  hosts: webserver
  gather_facts: true

  vars:
    usuario: admin
    ambiente: producao

  tasks:

    # ==========================================
    # EXEMPLO 1 - VARIÁVEL
    # ==========================================
    - name: Exibir variável definida pelo usuário
      debug:
        msg: "Usuário: {{ usuario }}"

    # ==========================================
    # EXEMPLO 2 - FACTS
    # ==========================================
    - name: Exibir facts coletados pelo Ansible
      debug:
        msg: "Hostname: {{ ansible_hostname }} | Sistema: {{ ansible_distribution }}"

    # ==========================================
    # EXEMPLO 3 - TEMPLATE JINJA2
    # ==========================================
    - name: Gerar arquivo de configuração usando template Jinja2
      template:
        src: config.j2
        dest: /tmp/config.txt

    # ==========================================
    # EXEMPLO 4 - TEMPLATE JINJA2 EXECUTADO
    # ==========================================
    - name: Exemplo de template Jinja2
      debug:
        msg: "Servidor {{ ansible_hostname }} executando {{ ansible_distribution }} no ambiente de {{ ambiente }}"
